apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: cloudops
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/EngMahmoudOu/cloudops-devops-project.git
    targetRevision: main
    path: helm/cloudops

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
