apiVersion: apps/v1
kind: Deployment

metadata:
  name: cloudops-deployment

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      app: cloudops

  template:
    metadata:
      labels:
        app: cloudops

    spec:
      containers:
        - name: cloudops
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - containerPort: {{ .Values.containerPort }}

          livenessProbe:
            httpGet:
              path: /health
              port: {{ .Values.containerPort }}

          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.containerPort }}
